<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Image Size Checker Pro</title>
  <defs>
    <clipPath id="frame">
      <rect x="41" y="45" width="42" height="33" rx="3.5"/>
    </clipPath>
    <!-- Fat arrow pointing along +x, tail at the origin, 20 units long -->
    <polygon id="arrow" points="0,-4.5 9,-4.5 9,-10 20,0 9,10 9,4.5 0,4.5"/>
  </defs>
  <g transform="rotate(-6 62 62)">
    <!-- Hard offset shadow, then the sticker -->
    <rect x="28" y="28" width="80" height="80" rx="18" fill="#111111"/>
    <rect x="22" y="22" width="80" height="80" rx="18" fill="#FFD43B" stroke="#111111" stroke-width="5"/>

    <!-- Picture frame -->
    <rect x="41" y="45" width="42" height="33" rx="3.5" fill="#FFFFFF"/>
    <g clip-path="url(#frame)">
      <circle cx="72" cy="54" r="4.5" fill="#FF6FAE" stroke="#111111" stroke-width="2.5"/>
      <polygon points="38,82 52,62 59,70 67,59 86,82" fill="#111111"/>
    </g>
    <rect x="41" y="45" width="42" height="33" rx="3.5" fill="none" stroke="#111111" stroke-width="4.5"/>

    <!-- Squeeze arrows: tails at the corners, heads at the frame -->
    <use href="#arrow" transform="translate(30 31) rotate(45)" fill="#2BD67B" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
    <use href="#arrow" transform="translate(95 93) rotate(225)" fill="#2BD67B" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
